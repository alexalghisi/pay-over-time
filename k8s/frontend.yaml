apiVersion: apps/v1
kind: Deployment
metadata:
    name: frontend
    labels:
        app: frontend
spec:
    replicas: 2
    selector:
        matchLabels:
            app: frontend
    template:
        metadata:
            labels:
                app: frontend
        spec:
            containers:
                - name: frontend
                  image: ghcr.io/alexalghisi/pay-over-time-frontend:latest
                  ports:
                      - containerPort: 8080
                  readinessProbe:
                      httpGet:
                          path: /
                          port: 8080
                  resources:
                      requests:
                          cpu: 50m
                          memory: 32Mi
                      limits:
                          memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
    name: frontend
spec:
    selector:
        app: frontend
    ports:
        - port: 80
          targetPort: 8080
