apiVersion: apps/v1
kind: Deployment
metadata:
    name: backend
    labels:
        app: backend
spec:
    replicas: 2
    selector:
        matchLabels:
            app: backend
    template:
        metadata:
            labels:
                app: backend
        spec:
            securityContext:
                runAsNonRoot: true
            containers:
                - name: backend
                  image: ghcr.io/alexalghisi/pay-over-time-backend:latest
                  ports:
                      - containerPort: 8000
                  env:
                      - name: PAYLATER_DATABASE_URL
                        valueFrom:
                            secretKeyRef:
                                name: paylater-database
                                key: url
                  readinessProbe:
                      httpGet:
                          path: /healthz
                          port: 8000
                      periodSeconds: 5
                  livenessProbe:
                      httpGet:
                          path: /healthz
                          port: 8000
                      periodSeconds: 15
                  resources:
                      requests:
                          cpu: 100m
                          memory: 128Mi
                      limits:
                          memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
    name: backend
spec:
    selector:
        app: backend
    ports:
        - port: 8000
          targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
    name: backend
spec:
    scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: backend
    minReplicas: 2
    maxReplicas: 10
    metrics:
        - type: Resource
          resource:
              name: cpu
              target:
                  type: Utilization
                  averageUtilization: 70
