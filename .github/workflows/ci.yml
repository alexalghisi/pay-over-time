name: ci

on:
    push:
        branches: [main]
    pull_request:

jobs:
    backend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_DATABASE: paylater
                    MYSQL_USER: paylater
                    MYSQL_PASSWORD: paylater
                    MYSQL_ROOT_PASSWORD: root
                ports: ["3306:3306"]
                options: --health-cmd="mysqladmin ping -h localhost" --health-interval=5s --health-retries=20
        env:
            PAYLATER_TEST_MYSQL_URL: mysql+pymysql://paylater:paylater@127.0.0.1:3306/paylater
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - run: pip install -e ".[dev]"
            - run: ruff check .
            - run: ruff format --check .
            - run: mypy
            - run: pytest

    frontend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - run: npm ci
            - run: npm run typecheck
            - run: npm test
            - run: npm run build

    e2e:
        needs: [backend, frontend]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: pip install ./backend
            - run: npm ci && npx playwright install --with-deps chromium
              working-directory: frontend
            - run: npm run e2e
              working-directory: frontend

    manifests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: |
                  curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
                  ./kubeconform -strict -summary -ignore-filename-pattern kustomization.yaml k8s/
