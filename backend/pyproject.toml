[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paylater"
version = "0.1.0"
description = "Pay-over-time quotes, plans and repayments for international markets"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "pydantic>=2.8",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "cryptography>=42",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests"]
