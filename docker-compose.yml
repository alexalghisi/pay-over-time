services:
    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: paylater
            MYSQL_USER: paylater
            MYSQL_PASSWORD: paylater
            MYSQL_ROOT_PASSWORD: root
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 5s
            retries: 20

    backend:
        build: ./backend
        environment:
            PAYLATER_DATABASE_URL: mysql+pymysql://paylater:paylater@mysql:3306/paylater
        depends_on:
            mysql:
                condition: service_healthy

    frontend:
        build: ./frontend
        ports:
            - "8080:8080"
        depends_on:
            - backend
